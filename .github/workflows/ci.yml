name: Test e Analisi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Dipendenze
        working-directory: app
        run: flutter pub get

      - name: Analisi
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test
